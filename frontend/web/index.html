<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="منصة إدارة أكاديميات كرة السلة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nosait Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nosait Academy</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA install prompt bridge (used by lib/core/services/pwa_install_service_web.dart) -->
  <script>
    (function () {
      window.__pwaDeferredPrompt = null;
      window.__pwaInstallable = false;

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.__pwaInstallable = true;
      });

      window.addEventListener('appinstalled', function () {
        window.__pwaDeferredPrompt = null;
        window.__pwaInstallable = false;
      });

      window.isPwaInstallable = function () {
        return !!window.__pwaInstallable && !isStandalone();
      };

      window.isPwaInstalled = function () {
        return isStandalone();
      };

      window.isIosDevice = function () {
        return /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;
      };

      window.triggerPwaInstall = function () {
        if (!window.__pwaDeferredPrompt) return;
        window.__pwaDeferredPrompt.prompt();
        window.__pwaDeferredPrompt.userChoice.finally(function () {
          window.__pwaDeferredPrompt = null;
          window.__pwaInstallable = false;
        });
      };
    })();
  </script>

  <!-- شاشة تحميل فورية: تظهر أثناء تنزيل main.dart.js (~6MB) بدل الشاشة البيضاء،
       وتختفي عند أول إطار يرسمه Flutter (حدث flutter-first-frame). -->
  <style>
    html, body { margin: 0; height: 100%; background: #1A2B4A; }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #2D3F63 0%, #1A2B4A 55%, #0D1A30 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #FFFFFF; transition: opacity .35s ease;
    }
    #app-loader.hide { opacity: 0; pointer-events: none; }
    #app-loader img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    #app-loader .name { margin-top: 18px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    #app-loader .spinner {
      margin-top: 28px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.18); border-top-color: #E85D04;
      animation: app-loader-spin .9s linear infinite;
    }
    #app-loader .hint { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.65); }
    @keyframes app-loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loader">
    <img src="assets/assets/images/logo1.jpg" alt="Nosait">
    <div class="name">Nosait</div>
    <div class="spinner"></div>
    <div class="hint">جاري التحميل...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loader');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
